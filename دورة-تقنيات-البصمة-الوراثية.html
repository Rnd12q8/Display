<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دورة تقنيات البصمة الوراثية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#051733;
    --bg-2:#0b3e82;
    --bg-3:#1665c4;
    --gold:#cdae5a;
    --gold-light:#e9d494;
    --gold-dim: rgba(205,174,90,0.4);
    --cream:#f3ede1;
    --muted:#a9c2e4;
    --green:#0a7a3d;
    --red:#c8102e;
    --ink:#051733;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--bg-1);
    font-family:'Tajawal', sans-serif;
    color:var(--cream);
    overflow:hidden;
  }

  .stage{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:3vh 4vw;
    background:
      radial-gradient(ellipse 120% 90% at 50% 8%, var(--bg-3) 0%, transparent 55%),
      radial-gradient(ellipse 90% 70% at 50% 100%, #04275c 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, #062a63 55%, var(--bg-1) 100%);
  }

  /* subtle geometric watermark pattern */
  .stage::before{
    content:"";
    position:absolute;
    inset:0;
    opacity:0.05;
    background-image:
      repeating-linear-gradient(45deg, var(--gold) 0, var(--gold) 1px, transparent 1px, transparent 42px),
      repeating-linear-gradient(-45deg, var(--gold) 0, var(--gold) 1px, transparent 1px, transparent 42px);
    pointer-events:none;
  }

  .flag-bar{
    position:absolute;
    left:0; right:0;
    height:7px;
    display:flex;
    z-index:3;
  }
  .flag-bar span{flex:1;}
  .flag-bar .c1{background:#0a0a0a;}
  .flag-bar .c2{background:var(--cream);}
  .flag-bar .c3{background:var(--green);}
  .flag-bar .c4{background:var(--red);}
  .flag-bar.top{top:0;}
  .flag-bar.bottom{bottom:0;}

  .content{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    max-width:920px;
    width:100%;
  }

  .emblem{
    width:clamp(120px, 15vw, 190px);
    height:auto;
    filter:drop-shadow(0 6px 24px rgba(0,0,0,0.55));
    margin-bottom:clamp(14px,2.4vh,26px);
  }

  .eyebrow{
    font-family:'Tajawal', sans-serif;
    font-weight:500;
    font-size:clamp(0.85rem, 1.3vw, 1.05rem);
    color:var(--gold-light);
    letter-spacing:1px;
    margin:0 0 10px;
    opacity:0.9;
  }

  h1.title{
    font-family:'Cairo', sans-serif;
    font-weight:900;
    font-size:clamp(1.9rem, 4.4vw, 3.4rem);
    line-height:1.25;
    margin:0;
    background:linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 65%, #a5811d 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 2px 30px rgba(201,162,39,0.15);
  }

  .divider{
    display:flex;
    align-items:center;
    gap:14px;
    margin:clamp(16px,2.6vh,28px) 0;
    width:100%;
    max-width:420px;
  }
  .divider .line{
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold-dim) 40%, var(--gold-dim) 60%, transparent);
  }
  .divider .mark{
    width:9px;height:9px;
    border:1.5px solid var(--gold);
    transform:rotate(45deg);
    flex:none;
  }

  .panel{
    position:relative;
    width:100%;
    max-width:640px;
    padding:clamp(20px,3vh,34px) clamp(24px,4vw,48px);
    border:1px solid var(--gold-dim);
    background:linear-gradient(180deg, rgba(18,44,82,0.55), rgba(8,20,40,0.45));
    backdrop-filter:blur(2px);
  }
  .panel .corner{
    position:absolute;
    width:22px;height:22px;
    border:2px solid var(--gold);
  }
  .panel .corner.tl{top:-1px;right:-1px;border-bottom:none;border-left:none;}
  .panel .corner.tr{top:-1px;left:-1px;border-bottom:none;border-right:none;}
  .panel .corner.bl{bottom:-1px;right:-1px;border-top:none;border-left:none;}
  .panel .corner.br{bottom:-1px;left:-1px;border-top:none;border-right:none;}

  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:clamp(10px,1.6vh,16px) 2px;
  }
  .row + .row{
    border-top:1px solid rgba(201,162,39,0.18);
  }
  .row .label{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:clamp(0.85rem, 1.15vw, 1rem);
    color:var(--muted);
    font-weight:500;
    white-space:nowrap;
  }
  .row .label svg{width:18px;height:18px;flex:none;stroke:var(--gold);}
  .row .value{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:clamp(1.05rem, 1.7vw, 1.35rem);
    color:var(--cream);
  }

  .status-pill{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:6px 16px;
    border:1px solid rgba(10,122,61,0.55);
    background:rgba(10,122,61,0.15);
    border-radius:999px;
  }
  .status-pill .dot{
    width:9px;height:9px;
    border-radius:50%;
    background:#28c76f;
    box-shadow:0 0 0 0 rgba(40,199,111,0.6);
    animation:pulse 1.8s infinite;
  }
  .status-pill .txt{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:clamp(0.95rem, 1.4vw, 1.1rem);
    color:#7be3a8;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(40,199,111,0.55);}
    70%{box-shadow:0 0 0 10px rgba(40,199,111,0);}
    100%{box-shadow:0 0 0 0 rgba(40,199,111,0);}
  }

  .footer-meta{
    position:absolute;
    bottom:22px;
    left:0; right:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 clamp(20px,4vw,56px);
    font-family:'Tajawal', sans-serif;
    font-size:clamp(0.78rem, 1vw, 0.95rem);
    color:var(--muted);
    z-index:2;
  }
  .footer-meta .clock{
    font-family:'Cairo', sans-serif;
    font-weight:700;
    color:var(--gold-light);
    letter-spacing:1px;
    direction:ltr;
    display:inline-block;
  }

  @media (max-width:560px){
    .footer-meta{position:static; margin-top:22px; flex-direction:column; gap:6px;}
    .panel{padding:18px 18px;}
  }
</style>
</head>

<script>
  const clockEl = document.getElementById('clock');
  const dateEl = document.getElementById('today');
  const days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  function tick(){
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    clockEl.textContent = `${h}:${m}:${s}`;
    dateEl.textContent = `${days[now.getDay()]} · ${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()}`;
  }
  tick();
  setInterval(tick, 1000);
</script>
